<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Validasi Paket HUB-HD</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel (untuk JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none;  scrollbar-width: none; }
        @media print { .no-print { display: none; } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">
    <div id="root"></div>

    <!-- MAIN SCRIPT -->
    <script type="text/babel" data-type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getFirestore, collection, doc, setDoc, getDoc, getDocs, 
            query, onSnapshot, addDoc, updateDoc, writeBatch, deleteDoc, serverTimestamp, 
            orderBy, where, limit 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // --- REACT HOOKS DESTRUCTURING (FIXED) ---
        const { useState, useEffect, useMemo } = React;

        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyAZFpX5OxSVIG7f58U60dVJHufHORFQuIg",
            authDomain: "hub-dashboard-92428.firebaseapp.com",
            projectId: "hub-dashboard-92428",
            storageBucket: "hub-dashboard-92428.firebasestorage.app",
            messagingSenderId: "827243064075",
            appId: "1:827243064075:web:ac948902fdbd6c9333d00e"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        // Menggunakan ID unik agar data tidak tercampur dengan user lain di firestore yang sama
        const APP_ID = 'hub-hd-prod-v1'; 

        // --- ICONS (Lucide Wrapper) ---
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- UI COMPONENTS ---
        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-slate-200 ${className}`}>
                {children}
            </div>
        );

        const Button = ({ children, onClick, variant = "primary", className = "", disabled = false, type = "button" }) => {
            const variants = {
                primary: "bg-blue-600 text-white hover:bg-blue-700",
                secondary: "bg-slate-100 text-slate-700 hover:bg-slate-200",
                danger: "bg-red-500 text-white hover:bg-red-600",
                success: "bg-emerald-500 text-white hover:bg-emerald-600",
                outline: "border border-slate-300 text-slate-600 hover:bg-slate-50"
            };
            return (
                <button 
                    type={type}
                    disabled={disabled}
                    onClick={onClick} 
                    className={`px-4 py-2 rounded-lg font-medium transition-all flex items-center justify-center gap-2 disabled:opacity-50 ${variants[variant]} ${className}`}
                >
                    {children}
                </button>
            );
        };

        const Input = ({ label, value, onChange, placeholder, type = "text", className = "" }) => (
            <div className={`flex flex-col gap-1 ${className}`}>
                {label && <label className="text-sm font-semibold text-slate-600">{label}</label>}
                <input 
                    type={type}
                    value={value}
                    onChange={(e) => onChange(e.target.value)}
                    placeholder={placeholder}
                    className="px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all w-full"
                />
            </div>
        );

        const Toast = ({ message, type, onClose }) => (
            <div className={`fixed bottom-4 right-4 z-50 flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg border animate-bounce ${
                type === 'success' ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-red-50 border-red-200 text-red-800'
            }`}>
                <Icon name={type === 'success' ? 'check-circle-2' : 'alert-circle'} size={20} />
                <span className="font-medium">{message}</span>
                <button onClick={onClose}><Icon name="x" size={16} /></button>
            </div>
        );

        // --- MAIN APP ---
        function App() {
            const [currentUser, setCurrentUser] = useState(null); // { username, role, name, id }
            const [activeTab, setActiveTab] = useState('dashboard');
            const [toast, setToast] = useState(null);
            
            // Global Settings State
            const [remarksList, setRemarksList] = useState(['Rusak', 'Salah Rute', 'Retur', 'Tanpa AWB', 'Packing Ulang']);
            const [hubSenders, setHubSenders] = useState([]); // List Pengirim

            const [packages, setPackages] = useState([]);
            const [handovers, setHandovers] = useState([]);
            const [loading, setLoading] = useState(true);

            // Init & Fetch Data
            useEffect(() => {
                const initSystem = async () => {
                    await signInAnonymously(auth);
                    const savedUser = localStorage.getItem('app_user');
                    if (savedUser) {
                        setCurrentUser(JSON.parse(savedUser));
                    }
                    setLoading(false);
                };
                initSystem();
            }, []);

            // Realtime Listeners
            useEffect(() => {
                if (!currentUser) return;

                const qPackages = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'packages'), orderBy('created_at', 'desc'));
                const unsubPackages = onSnapshot(qPackages, (snap) => {
                    setPackages(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const qHandovers = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'handovers'), orderBy('timestamp', 'desc'));
                const unsubHandovers = onSnapshot(qHandovers, (snap) => {
                    setHandovers(snap.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });

                const docSettings = doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'config');
                const unsubSettings = onSnapshot(docSettings, (doc) => {
                    if (doc.exists()) {
                        const data = doc.data();
                        setRemarksList(data.hub_remarks || []);
                        setHubSenders(data.hub_senders || []);
                    }
                });

                return () => {
                    unsubPackages();
                    unsubHandovers();
                    unsubSettings();
                };
            }, [currentUser]);

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3000);
            };

            const handleLogout = () => {
                localStorage.removeItem('app_user');
                setCurrentUser(null);
                setActiveTab('dashboard');
            };

            if (loading) return <div className="h-screen flex items-center justify-center text-slate-500">Memuat Sistem...</div>;

            if (!currentUser) {
                return <LoginView onLogin={(user) => {
                    setCurrentUser(user);
                    localStorage.setItem('app_user', JSON.stringify(user));
                    showToast(`Selamat datang, ${user.name}`);
                }} showToast={showToast} />;
            }

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col md:flex-row">
                    <Sidebar 
                        role={currentUser.role} 
                        name={currentUser.name} 
                        activeTab={activeTab} 
                        setActiveTab={setActiveTab} 
                        onLogout={handleLogout} 
                    />

                    <main className="flex-1 p-4 md:p-8 overflow-y-auto max-h-screen no-scrollbar">
                        <header className="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
                            <div>
                                <h2 className="text-2xl font-bold text-slate-800 capitalize">{activeTab.replace('-', ' ')}</h2>
                                <p className="text-slate-500 text-sm">Sistem Validasi Handover HUB & HD</p>
                            </div>
                            <div className="flex items-center gap-2 text-sm text-slate-500 bg-white px-4 py-2 rounded-lg border border-slate-200">
                                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                Sistem Online
                            </div>
                        </header>

                        {activeTab === 'dashboard' && <DashboardView packages={packages} handovers={handovers} />}
                        {/* Kirim hubSenders ke HubInputView */}
                        {activeTab === 'hub-input' && <HubInputView remarks={remarksList} senders={hubSenders} showToast={showToast} currentUser={currentUser} handovers={handovers} />}
                        {activeTab === 'hd-input' && <HdInputView packages={packages} showToast={showToast} currentUser={currentUser} />}
                        {/* Kirim packages ke DataHandoverView untuk tab detail */}
                        {activeTab === 'data-handover' && <DataHandoverView handovers={handovers} packages={packages} />}
                        {activeTab === 'settings' && <SettingsView remarks={remarksList} senders={hubSenders} showToast={showToast} />}
                    </main>

                    {toast && <Toast {...toast} onClose={() => setToast(null)} />}
                </div>
            );
        }

        // --- LOGIN VIEW ---
        function LoginView({ onLogin, showToast }) {
            const [username, setUsername] = useState("");
            const [password, setPassword] = useState("");
            const [isChecking, setIsChecking] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsChecking(true);

                try {
                    const usersRef = collection(db, 'artifacts', APP_ID, 'public', 'data', 'users');
                    const q = query(usersRef);
                    const snapshot = await getDocs(q);

                    if (snapshot.empty) {
                        if (username === 'admin' && password === 'admin') {
                            const defaultUser = { username: 'admin', password: 'admin', role: 'admin', name: 'Super Admin', created_at: serverTimestamp() };
                            await addDoc(usersRef, defaultUser);
                            onLogin({ ...defaultUser, id: 'init_admin' });
                            return;
                        } else {
                            showToast("Database kosong. Gunakan user: admin, pass: admin", "error");
                            setIsChecking(false);
                            return;
                        }
                    }

                    const users = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    const foundUser = users.find(u => u.username === username && u.password === password);

                    if (foundUser) {
                        onLogin(foundUser);
                    } else {
                        showToast("Username atau Password salah", "error");
                    }

                } catch (err) {
                    console.error(err);
                    showToast("Terjadi kesalahan koneksi", "error");
                } finally {
                    setIsChecking(false);
                }
            };

            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 shadow-2xl">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-xl shadow-blue-500/20">
                                <Icon name="package-search" size={32} className="text-white" />
                            </div>
                            <h1 className="text-2xl font-bold text-white">VAL-PAKET Login</h1>
                            <p className="text-slate-400 mt-2 text-sm">Masukkan kredensial Anda</p>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="text-slate-400 text-sm font-medium mb-1 block">Username</label>
                                <input type="text" value={username} onChange={e => setUsername(e.target.value)} className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan username" required />
                            </div>
                            <div>
                                <label className="text-slate-400 text-sm font-medium mb-1 block">Password</label>
                                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Masukkan password" required />
                            </div>
                            <Button type="submit" className="w-full py-3 mt-4" disabled={isChecking}>{isChecking ? "Memeriksa..." : "Masuk Sistem"}</Button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- COMPONENT: SIDEBAR ---
        function Sidebar({ role, name, activeTab, setActiveTab, onLogout }) {
            const NavItem = ({ icon, label, id, visible }) => {
                if (!visible) return null;
                return (
                    <button 
                        onClick={() => setActiveTab(id)}
                        className={`flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium w-full text-left ${
                            activeTab === id
                                ? "bg-blue-600 text-white shadow-lg shadow-blue-900/20" 
                                : "text-slate-400 hover:text-white hover:bg-slate-800"
                        }`}
                    >
                        <Icon name={icon} size={20}/>
                        <span>{label}</span>
                    </button>
                );
            };

            return (
                <aside className="w-full md:w-64 bg-slate-900 text-white flex flex-col no-print">
                    <div className="p-6 border-b border-slate-800">
                        <h1 className="text-xl font-bold flex items-center gap-2">
                            <Icon name="package-search" className="text-blue-400" />
                            VAL-PAKET
                        </h1>
                    </div>
                    
                    <nav className="flex-1 p-4 flex flex-col gap-2">
                        <NavItem icon="layout-dashboard" label="Dashboard" id="dashboard" visible={true} />
                        <NavItem icon="plus" label="Input HUB" id="hub-input" visible={role === 'admin' || role === 'hub'} />
                        <NavItem icon="truck" label="Input HD" id="hd-input" visible={role === 'admin' || role === 'hd'} />
                        {/* UPDATE: Ganti label menu */}
                        <NavItem icon="file-text" label="Data Handover" id="data-handover" visible={true} />
                        <NavItem icon="settings" label="Pengaturan" id="settings" visible={role === 'admin'} />
                    </nav>

                    <div className="p-4 border-t border-slate-800">
                        <div className="flex items-center gap-3 mb-4 px-2">
                            <div className="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-xs font-bold uppercase">
                                {role[0]}
                            </div>
                            <div className="overflow-hidden">
                                <p className="text-sm font-medium truncate">{name}</p>
                                <p className="text-xs text-slate-400 capitalize">{role}</p>
                            </div>
                        </div>
                        <button onClick={onLogout} className="w-full flex items-center gap-2 px-3 py-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-all">
                            <Icon name="log-out" size={18} /> <span>Keluar</span>
                        </button>
                    </div>
                </aside>
            );
        }

        // --- COMPONENT: DASHBOARD ---
        function DashboardView({ packages }) {
            const stats = useMemo(() => ({
                total: packages.length,
                diHd: packages.filter(p => p.status_paket === 'Di HD').length,
                kembali: packages.filter(p => p.status_paket === 'Kembali ke HUB').length,
                anomali: packages.filter(p => p.status_paket === 'Anomali HD').length,
            }), [packages]);

            const StatCard = ({ title, value, icon, color }) => {
                const bgColors = { blue: "bg-blue-50", amber: "bg-amber-50", emerald: "bg-emerald-50", red: "bg-red-50" };
                const textColors = { blue: "text-blue-500", amber: "text-amber-500", emerald: "text-emerald-500", red: "text-red-500" };
                return (
                    <Card className="p-6 flex items-center justify-between">
                        <div>
                            <p className="text-sm font-medium text-slate-500 mb-1">{title}</p>
                            <p className="text-3xl font-bold text-slate-800">{value}</p>
                        </div>
                        <div className={`p-4 rounded-xl ${bgColors[color]}`}>
                            <Icon name={icon} className={textColors[color]} size={24} />
                        </div>
                    </Card>
                );
            };

            const StatusBadge = ({ status }) => {
                const styles = {
                    "Di HD": "bg-amber-100 text-amber-700 border-amber-200",
                    "Kembali ke HUB": "bg-emerald-100 text-emerald-700 border-emerald-200",
                    "Anomali HD": "bg-red-100 text-red-700 border-red-200",
                    "Cek Kembali": "bg-slate-100 text-slate-700 border-slate-200"
                };
                return <span className={`px-2 py-1 rounded-full text-[10px] font-bold uppercase border ${styles[status]}`}>{status}</span>;
            };

            return (
                <div className="space-y-6">
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <StatCard title="Total Paket" value={stats.total} icon="package-search" color="blue" />
                        <StatCard title="Ada di HD" value={stats.diHd} icon="truck" color="amber" />
                        <StatCard title="Sudah Kembali" value={stats.kembali} icon="check-circle-2" color="emerald" />
                        <StatCard title="Anomali / Tanpa AWB" value={stats.anomali} icon="alert-circle" color="red" />
                    </div>

                    <Card className="overflow-hidden">
                        <div className="p-4 border-b border-slate-100 font-bold text-slate-700">Aktivitas Paket Terbaru</div>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-50 text-slate-500 uppercase text-xs font-semibold">
                                    <tr>
                                        <th className="px-6 py-4">AWB / Keterangan</th>
                                        <th className="px-6 py-4">Status</th>
                                        <th className="px-6 py-4">Tgl Kirim</th>
                                        <th className="px-6 py-4">Remarks HUB</th>
                                        <th className="px-6 py-4">Sender</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {packages.slice(0, 10).map((p) => (
                                        <tr key={p.id} className="hover:bg-slate-50/50">
                                            <td className="px-6 py-4 font-mono font-medium text-slate-700">
                                                {p.awb || <span className="text-slate-400 italic">Non-AWB: {p.keterangan_fisik}</span>}
                                            </td>
                                            <td className="px-6 py-4"><StatusBadge status={p.status_paket} /></td>
                                            <td className="px-6 py-4 text-slate-500">
                                                {p.tanggal_kirim?.toDate?.().toLocaleDateString('id-ID')}
                                            </td>
                                            <td className="px-6 py-4"><span className="bg-slate-100 px-2 py-1 rounded text-xs">{p.remarks_hub}</span></td>
                                            <td className="px-6 py-4 text-slate-500">{p.pengirim_hub}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                            {packages.length === 0 && <div className="p-10 text-center text-slate-400">Belum ada data paket.</div>}
                        </div>
                    </Card>
                </div>
            );
        }

        // --- COMPONENT: HUB INPUT ---
        const ConfirmModal = ({ isOpen, data, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[70] flex items-center justify-center bg-black/50 p-4 animate-in fade-in zoom-in duration-200">
                    <Card className="w-full max-w-sm p-6 shadow-2xl border-0">
                        <div className="flex flex-col items-center text-center gap-4">
                            <div className={`p-4 rounded-full ${data.type === 'danger' ? 'bg-red-100 text-red-600' : data.type === 'success' ? 'bg-emerald-100 text-emerald-600' : 'bg-blue-100 text-blue-600'}`}>
                                <Icon name={data.type === 'danger' ? 'alert-triangle' : data.type === 'success' ? 'check' : 'info'} size={32} />
                            </div>
                            <div>
                                <h3 className="font-bold text-lg text-slate-800">{data.title}</h3>
                                <p className="text-slate-500 text-sm mt-1">{data.message}</p>
                            </div>
                            <div className="flex gap-3 w-full mt-2">
                                <Button variant="secondary" onClick={onClose} className="flex-1">{data.cancelLabel || "Batal"}</Button>
                                <Button variant={data.type === 'danger' ? 'danger' : 'primary'} onClick={data.onConfirm} className="flex-1">{data.confirmLabel || "Ya, Lanjutkan"}</Button>
                            </div>
                        </div>
                    </Card>
                </div>
            );
        };

        const SuratJalanPrintModal = ({ data, onClose }) => {
            if (!data) return null;

            useEffect(() => {
                const timer = setTimeout(() => { window.print(); }, 500); 
                return () => clearTimeout(timer);
            }, []);

            const getRowData = (item) => {
                if (typeof item === 'string') {
                    if (item.startsWith("Non-AWB:")) {
                        return { awb: "-", remarks: "Tanpa AWB", description: item.replace("Non-AWB:", "").trim() };
                    }
                    return { awb: item, remarks: "-", description: "-" };
                }
                return { awb: item.awb || "-", remarks: item.remarks || "-", description: item.description || "-" };
            };

            return (
                <div className="fixed inset-0 z-[80] bg-slate-900/50 flex items-center justify-center p-4 overflow-y-auto">
                    <style>{`
                        @media print {
                            @page { size: landscape; margin: 0.5cm; }
                            body { visibility: hidden; }
                            .print-modal-content { visibility: visible; position: absolute; left: 0; top: 0; width: 100% !important; max-width: none !important; margin: 0 !important; padding: 20px !important; box-shadow: none !important; border: none !important; }
                            .print-modal-content * { visibility: visible; }
                            .no-print { display: none !important; }
                        }
                    `}</style>
                    <Card className="max-w-[90%] w-full p-8 bg-white relative my-8 print-modal-content">
                        <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 no-print"><Icon name="x" size={24} /></button>
                        <div className="p-4 space-y-6">
                            <div className="flex justify-between items-start border-b-4 border-slate-800 pb-4 mb-6">
                                <div><h2 className="text-3xl font-black uppercase tracking-wider text-slate-800">FORM SERAH TERIMA</h2></div>
                                <div className="text-right"><p className="font-mono text-xl font-bold text-slate-800">{data.id}</p><p className="text-xs text-slate-500 italic mt-1">Dicetak: {new Date().toLocaleString('id-ID')}</p></div>
                            </div>
                            <div className="flex justify-between bg-slate-50 p-4 rounded-lg border border-slate-200">
                                <div><table className="text-sm"><tbody><tr><td className="pr-4 py-1 text-slate-500 font-medium">Dari:</td><td className="font-bold uppercase">{data.sender}</td></tr><tr><td className="pr-4 py-1 text-slate-500 font-medium">Tipe:</td><td className="font-bold uppercase">{data.type}</td></tr></tbody></table></div>
                                <div className="text-right"><p className="text-xs font-bold text-slate-500 uppercase">Total Muatan</p><p className="text-3xl font-black text-slate-800">{data.total_items} <span className="text-sm font-medium text-slate-500">Item</span></p></div>
                            </div>
                            <div className="mt-6">
                                <h3 className="font-bold text-slate-800 mb-2 uppercase text-xs tracking-wider border-l-4 border-blue-600 pl-2">Rincian Paket</h3>
                                <table className="w-full text-left text-sm border-collapse border border-slate-300">

                            <form onSubmit={addPackageToList} className="space-y-4">

                                <div className="flex flex-col gap-1"><label className="text-sm font-semibold text-slate-600">Remarks HUB</label><select value={currentRemark} onChange={(e) => setCurrentRemark(e.target.value)} className="px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none w-full">{remarks.map(r => <option key={r} value={r}>{r}</option>)}</select></div>

        // --- COMPONENT: HD INPUT ---
        function HdInputView({ packages, showToast, currentUser }) {
            const [bulkInput, setBulkInput] = useState("");
            const [isProcessing, setIsProcessing] = useState(false);
            
            // State untuk Konfirmasi & Cetak (Sama seperti HUB)
            const [confirmState, setConfirmState] = useState({ isOpen: false, title: "", message: "", type: "info", confirmLabel: "", cancelLabel: "", onConfirm: () => {} });
            const [printData, setPrintData] = useState(null);

            const processHdHandover = async () => {
                if (!bulkInput.trim()) return;
                setIsProcessing(true);
                
                // Parsing Input: Mendukung format "AWB" atau "AWB, Remarks" (separator koma, tab, atau pipe)
                const lines = bulkInput.split('\n').filter(l => l.trim() !== "");
                const processedItems = lines.map(line => {
                    // Cek separator common (koma, tab, pipe)
                    const parts = line.split(/[\t,|]/); 
                    const awb = parts[0].trim();
                    // Jika ada text setelah separator, jadikan remarks. Jika tidak, default "Sesuai"
                    const remarks = parts.length > 1 && parts[1].trim() !== "" ? parts[1].trim() : "Sesuai";
                    return { awb, remarks };
                });

                let matchedCount = 0;
                let anomaliCount = 0;

                try {
                    const batch = writeBatch(db);
                    const handoverId = `HO-HD-${Date.now()}`; // Bisa diganti logic generate ID jika perlu

                    const handoverRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'handovers'), handoverId);
                    
                    // Siapkan data item untuk Surat Jalan
                    const detailedItems = processedItems.map(item => ({
                        awb: item.awb,
                        remarks: item.remarks,
                        description: "-" // Deskripsi fisik kosong default untuk HD
                    }));

                    const handoverData = {
                        id: handoverId,
                        type: 'HD-HUB',
                        sender: currentUser.name,
                        total_items: processedItems.length,
                        timestamp: { toDate: () => new Date() }, // Mock date for preview
                        items: detailedItems
                    };

                    // Simpan Master Handover
                    batch.set(handoverRef, {
                        ...handoverData,
                        timestamp: serverTimestamp()
                    });

                    // Proses setiap AWB
                    for (const item of processedItems) {
                        const existingPkg = packages.find(p => p.awb === item.awb && p.status_paket === 'Di HD');
                        
                        if (existingPkg) {
                            const pkgRef = doc(db, 'artifacts', APP_ID, 'public', 'data', 'packages', existingPkg.id);
                            batch.update(pkgRef, {
                                status_paket: "Kembali ke HUB",
                                tanggal_kembali: serverTimestamp(),
                                remarks_hd: item.remarks, // Remarks spesifik per item
                                hd_validator: currentUser.name
                            });
                            matchedCount++;
                        } else {
                            // Anomali (Barang tidak ada di sistem HUB tapi dikembalikan HD)
                            const newAnomaliRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'packages'));
                            batch.set(newAnomaliRef, {
                                awb: item.awb,
                                status_paket: "Anomali HD",
                                tanggal_kembali: serverTimestamp(),
                                remarks_hd: item.remarks, // Remarks spesifik per item
                                catatan_hd: "Tidak Terdata di HUB sebelumnya",
                                hd_validator: currentUser.name,
                                created_at: serverTimestamp(),
                                pengirim_hub: "System (Anomali)"
                            });
                            anomaliCount++;
                        }
                    }

                    await batch.commit();
                    showToast(`Selesai: ${matchedCount} Match, ${anomaliCount} Anomali.`);
                    setBulkInput("");

                    // --- KONFIRMASI CETAK SURAT JALAN (Sama seperti HUB) ---
                    setConfirmState({
                        isOpen: true,
                        title: "Handover Berhasil",
                        message: "Data pengembalian tersimpan. Cetak Form Serah Terima sekarang?",
                        type: "success",
                        confirmLabel: "Cetak & Preview",
                        cancelLabel: "Nanti",
                        onConfirm: () => {
                            setPrintData(handoverData);
                            setConfirmState(prev => ({ ...prev, isOpen: false }));
                        }
                    });

                } catch (err) {
                    console.error(err);
                    showToast("Gagal memproses data HD", "error");
                } finally {
                    setIsProcessing(false);
                }
            };

            return (
                <div className="max-w-4xl mx-auto space-y-6 relative">
                    {/* MODAL KONFIRMASI */}
                    <ConfirmModal 
                        isOpen={confirmState.isOpen} 
                        data={confirmState} 
                        onClose={() => setConfirmState(prev => ({ ...prev, isOpen: false }))} 
                    />

                    {/* MODAL CETAK SURAT JALAN */}
                    <SuratJalanPrintModal 
                        data={printData} 
                        onClose={() => setPrintData(null)} 
                    />

                    <Card className="p-6">
                        <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2">
                            <Icon name="truck" size={18} className="text-amber-500" />
                            Proses Pengembalian HD ke HUB
                        </h3>
                        <div className="grid grid-cols-1 gap-6">
                            <div className="flex flex-col gap-2">
                                <div className="flex justify-between items-center">
                                    <label className="text-sm font-semibold text-slate-600">
                                        List AWB & Feedback
                                    </label>
                                    <span className="text-xs text-slate-400 italic">
                                        Format: <strong>AWB</strong> (Enter) atau <strong>AWB, Keterangan</strong>
                                    </span>
                                </div>
                                <textarea 
                                    rows={12}
                                    value={bulkInput}
                                    onChange={(e) => setBulkInput(e.target.value)}
                                    placeholder={`Contoh:\nJD0123456789\nJD0987654321, Rusak Packing\nJD1122334455, Retur Customer`}
                                    className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-amber-500 outline-none font-mono text-sm leading-relaxed"
                                />
                                <div className="bg-amber-50 border border-amber-100 rounded-lg p-3 text-xs text-amber-700 flex gap-2">
                                    <Icon name="info" size={16} className="shrink-0 mt-0.5" />
                                    <p>Masukkan satu AWB per baris. Jika AWB tidak memiliki keterangan (separator koma/tab), sistem otomatis memberi status <strong>"Sesuai"</strong>.</p>
                                </div>
                            </div>
                            
                            <Button 
                                onClick={processHdHandover} 
                                className="w-full bg-amber-600 hover:bg-amber-700 h-14 text-lg shadow-lg shadow-amber-600/20"
                                disabled={isProcessing || !bulkInput.trim()}
                            >
                                {isProcessing ? "Memproses Data..." : "Proses Balik ke HUB & Cetak"}
                            </Button>
                        </div>
                    </Card>
                </div>
            );
        }

                    {activeTab === 'history' && (
                        <Card>
                            <div className="p-4 border-b border-slate-100 font-bold text-slate-700">Riwayat Serah Terima (Cetak Ulang)</div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-50 text-slate-500 text-xs uppercase">
                                        <tr>
                                            <th className="px-6 py-4">No. Surat</th>
                                            <th className="px-6 py-4">Tipe</th>
                                            <th className="px-6 py-4">Pengirim</th>
                                            <th className="px-6 py-4">Total</th>
                                            <th className="px-6 py-4">Waktu</th>
                                            <th className="px-6 py-4 text-right">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {handovers.map(ho => (
                                            <tr key={ho.id} className="hover:bg-slate-50">
                                                <td className="px-6 py-4 font-mono font-bold text-blue-600">{ho.id}</td>
                                                <td className="px-6 py-4 font-semibold">{ho.type}</td>
                                                <td className="px-6 py-4 text-slate-600">{ho.sender}</td>
                                                <td className="px-6 py-4 font-bold">{ho.total_items}</td>
                                                <td className="px-6 py-4 text-slate-500">{ho.timestamp?.toDate?.().toLocaleString('id-ID')}</td>
                                                <td className="px-6 py-4 text-right">
                                                    <Button onClick={() => setSelectedHo(ho)} variant="outline" className="text-xs inline-flex py-1 px-3">
                                                        <Icon name="printer" size={14} /> Cetak
                                                    </Button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                                {handovers.length === 0 && <div className="p-10 text-center text-slate-400">Belum ada riwayat.</div>}
                            </div>
                        </Card>
                    )}

                    {/* TAB CONTENT: DETAIL & VALIDASI (FULL TABLE EXPANDED) */}
                    {activeTab === 'detail' && (
                        <Card className="min-h-[600px] flex flex-col">
                            {/* Toolbar Filter */}
                            <div className="p-4 border-b border-slate-100 bg-slate-50 flex flex-col md:flex-row justify-between items-center gap-4">
                                <h3 className="font-bold text-slate-700 flex items-center gap-2">
                                    <Icon name="database" size={18} className="text-blue-500" />
                                    Data Semua Paket (Breakdown Lengkap)
                                </h3>
                                <div className="flex flex-col md:flex-row gap-2 w-full md:w-auto">
                                    <select 
                                        value={filterStatus} 
                                        onChange={(e) => setFilterStatus(e.target.value)}
                                        className="px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                                    >
                                        <option value="All">Semua Status</option>
                                        <option value="Di HD">Di HD</option>
                                        <option value="Kembali ke HUB">Kembali ke HUB</option>
                                        <option value="Anomali HD">Anomali HD</option>
                                    </select>
                                    <div className="relative w-full md:w-64">
                                        <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                                        <input 
                                            type="text" 
                                            value={searchTerm}
                                            onChange={(e) => setSearchTerm(e.target.value)}
                                            placeholder="Cari AWB, Handover, User..."
                                            className="pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-blue-500 outline-none w-full"
                                        />
                                    </div>
                                </div>
                            </div>

                            {/* Tabel Data Lengkap Breakdown */}
                            <div className="overflow-x-auto flex-1">
                                <table className="w-full text-left text-sm whitespace-nowrap">
                                    <thead className="bg-white text-slate-500 text-xs uppercase font-bold sticky top-0 shadow-sm z-10">
                                        <tr>
                                            <th className="px-4 py-3 bg-slate-50 border-b w-10 text-center">No</th>
                                            <th className="px-4 py-3 bg-slate-50 border-b">Waktu Input (HUB)</th>
                                            <th className="px-4 py-3 bg-slate-50 border-b">No. Handover</th>
                                            <th className="px-4 py-3 bg-slate-50 border-b">Pengirim (HUB)</th>
                                            <th className="px-4 py-3 bg-slate-50 border-b">AWB / Resi</th>
                                            <th className="px-4 py-3 bg-slate-50 border-b">Ket. Fisik</th>
                                            <th className="px-4 py-3 bg-slate-50 border-b">Remarks HUB</th>
                                            <th className="px-4 py-3 bg-slate-50 border-b text-center">Status</th>
                                            <th className="px-4 py-3 bg-slate-50 border-b">Waktu Validasi (HD)</th>
                                            <th className="px-4 py-3 bg-slate-50 border-b">Validator (HD)</th>
                                            <th className="px-4 py-3 bg-slate-50 border-b">Remarks HD</th>
                                            <th className="px-4 py-3 bg-slate-50 border-b">Catatan HD</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                        {filteredPackages.map((pkg, index) => (
                                            <tr key={pkg.id} className="hover:bg-slate-50 transition-colors">
                                                <td className="px-4 py-3 text-slate-500 text-xs text-center border-r border-slate-50">{index + 1}</td>
                                                
                                                {/* DATA HUB */}
                                                <td className="px-4 py-3 text-slate-600 text-xs">
                                                    <div>{pkg.created_at?.toDate?.().toLocaleDateString('id-ID') || "-"}</div>
                                                    <div className="text-[10px] text-slate-400">{pkg.created_at?.toDate?.().toLocaleTimeString('id-ID') || ""}</div>
                                                </td>
                                                <td className="px-4 py-3 font-mono font-bold text-blue-600 text-xs">
                                                    {pkg.handover_id || <span className="text-slate-300 italic">-</span>}
                                                </td>
                                                <td className="px-4 py-3 text-slate-700 text-xs font-medium">{pkg.pengirim_hub}</td>
                                                <td className="px-4 py-3 font-mono font-medium text-slate-800 text-xs border-l border-slate-50">
                                                    {pkg.awb || "-"}
                                                </td>
                                                <td className="px-4 py-3 text-slate-500 text-xs italic">
                                                    {pkg.keterangan_fisik || "-"}
                                                </td>
                                                <td className="px-4 py-3">
                                                    <span className="bg-slate-100 px-2 py-1 rounded text-[10px] border border-slate-200 text-slate-600">{pkg.remarks_hub}</span>
                                                </td>

                                                {/* STATUS */}
                                                <td className="px-4 py-3 text-center border-l border-r border-slate-50">
                                                    <span className={`px-2 py-1 rounded-full text-[10px] font-bold uppercase border ${
                                                        pkg.status_paket === 'Di HD' ? 'bg-amber-100 text-amber-700 border-amber-200' :
                                                        pkg.status_paket === 'Kembali ke HUB' ? 'bg-emerald-100 text-emerald-700 border-emerald-200' :
                                                        'bg-red-100 text-red-700 border-red-200'
                                                    }`}>
                                                        {pkg.status_paket}
                                                    </span>
                                                </td>

                                                {/* DATA HD */}
                                                <td className="px-4 py-3 text-slate-600 text-xs">
                                                    {pkg.tanggal_kembali ? (
                                                        <>
                                                            <div>{pkg.tanggal_kembali.toDate().toLocaleDateString('id-ID')}</div>
                                                            <div className="text-[10px] text-slate-400">{pkg.tanggal_kembali.toDate().toLocaleTimeString('id-ID')}</div>
                                                        </>
                                                    ) : "-"}
                                                </td>
                                                <td className="px-4 py-3 text-slate-700 text-xs font-medium">
                                                    {pkg.hd_validator || "-"}
                                                </td>
                                                <td className="px-4 py-3 text-slate-700 text-xs">
                                                    {pkg.remarks_hd || "-"}
                                                </td>
                                                <td className="px-4 py-3 text-slate-500 text-xs italic max-w-[200px] truncate" title={pkg.catatan_hd}>
                                                    {pkg.catatan_hd || "-"}
                                                </td>
                                            </tr>
                                        ))}
                                        {filteredPackages.length === 0 && (
                                            <tr>
                                                <td colSpan="12" className="p-10 text-center text-slate-400">
                                                    <div className="flex flex-col items-center gap-2">
                                                        <Icon name="search-x" size={32} className="opacity-30" />
                                                        <span>Data tidak ditemukan.</span>
                                                    </div>
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                            <div className="p-4 border-t border-slate-100 bg-slate-50 text-xs text-slate-500 text-right">
                                Menampilkan {filteredPackages.length} data paket
                            </div>
                        </Card>
                    )}

                    {/* Menggunakan Reusable Component untuk Modal */}
                    <SuratJalanPrintModal 
                        data={selectedHo} 
                        onClose={() => setSelectedHo(null)} 
                    />
                </div>
            );
        }

        // --- COMPONENT: SETTINGS ---
        function SettingsView({ remarks, senders, showToast }) {
            const [newRemark, setNewRemark] = useState("");
            const [newSender, setNewSender] = useState(""); // Input Pengirim Baru
            const [users, setUsers] = useState([]);
            
            // User Form States
            const [uName, setUName] = useState("");
            const [uUser, setUUser] = useState("");
            const [uPass, setUPass] = useState("");
            const [uRole, setURole] = useState("hub");
            const [isEditingUser, setIsEditingUser] = useState(null);

            useEffect(() => {
                const qUsers = query(collection(db, 'artifacts', APP_ID, 'public', 'data', 'users'));
                const unsub = onSnapshot(qUsers, (snap) => {
                    setUsers(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                });
                return () => unsub();
            }, []);

            // Remarks Logic
            const handleAddRemark = async () => {
                if (!newRemark.trim()) return;
                const updated = [...remarks, newRemark];
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'config'), { hub_remarks: updated }, { merge: true });
                setNewRemark("");
            };

            const handleRemoveRemark = async (rem) => {
                const updated = remarks.filter(r => r !== rem);
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'config'), { hub_remarks: updated }, { merge: true });
            };

            // Sender Logic
            const handleAddSender = async () => {
                if (!newSender.trim()) return;
                const currentSenders = senders || [];
                const updated = [...currentSenders, newSender];
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'config'), { hub_senders: updated }, { merge: true });
                setNewSender("");
                showToast("Pengirim HUB berhasil ditambahkan");
            };

            const handleRemoveSender = async (senderName) => {
                const updated = (senders || []).filter(s => s !== senderName);
                await setDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'settings', 'config'), { hub_senders: updated }, { merge: true });
                showToast("Pengirim HUB dihapus");
            };

            // User Management Logic
            const handleSaveUser = async (e) => {
                e.preventDefault();
                try {
                    const userData = {
                        name: uName,
                        username: uUser,
                        password: uPass,
                        role: uRole
                    };

                    if (isEditingUser) {
                        await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', isEditingUser), userData);
                        showToast("User berhasil diperbarui");
                    } else {
                        if (users.some(u => u.username === uUser)) {
                            showToast("Username sudah dipakai", "error");
                            return;
                        }
                        await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', 'users'), {
                            ...userData,
                            created_at: serverTimestamp()
                        });
                        showToast("User berhasil ditambah");
                    }
                    resetUserForm();
                } catch (err) {
                    console.error(err);
                    showToast("Gagal menyimpan user", "error");
                }
            };

            const handleDeleteUser = async (id) => {
                if (users.length <= 1) {
                    showToast("Tidak bisa menghapus user terakhir", "error");
                    return;
                }
                if (confirm("Yakin hapus user ini?")) {
                    await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', 'users', id));
                    showToast("User dihapus");
                }
            };

            const editUser = (user) => {
                setIsEditingUser(user.id);
                setUName(user.name);
                setUUser(user.username);
                setUPass(user.password);
                setURole(user.role);
            };

            const resetUserForm = () => {
                setIsEditingUser(null);
                setUName("");
                setUUser("");
                setUPass("");
                setURole("hub");
            };

            return (
                <div className="space-y-8">
                    {/* MANAJEMEN REMARKS */}
                    <Card className="max-w-4xl p-6">
                        <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2">
                            <Icon name="settings" size={18} className="text-slate-500" />
                            Master Data Remarks HUB
                        </h3>
                        <div className="flex gap-2 mb-6">
                            <Input className="flex-1" value={newRemark} onChange={setNewRemark} placeholder="Tambah remark..." />
                            <Button onClick={handleAddRemark} className="mt-auto">Tambah</Button>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {remarks.map(r => (
                                <div key={r} className="flex items-center gap-2 px-3 py-2 bg-slate-100 border rounded-lg text-sm">
                                    <span>{r}</span>
                                    <button onClick={() => handleRemoveRemark(r)} className="text-red-400 hover:text-red-600"><Icon name="x" size={14} /></button>
                                </div>
                            ))}
                        </div>
                    </Card>

                    {/* MANAJEMEN PENGIRIM HUB */}
                    <Card className="max-w-4xl p-6">
                        <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2">
                            <Icon name="user-check" size={18} className="text-slate-500" />
                            Master Data Pengirim HUB (Opsi Pilihan)
                        </h3>
                        <div className="flex gap-2 mb-6">
                            <Input className="flex-1" value={newSender} onChange={setNewSender} placeholder="Tambah nama pengirim..." />
                            <Button onClick={handleAddSender} className="mt-auto">Tambah</Button>
                        </div>
                        <div className="flex flex-wrap gap-2">
                            {senders && senders.map(s => (
                                <div key={s} className="flex items-center gap-2 px-3 py-2 bg-blue-50 border border-blue-100 rounded-lg text-sm text-blue-700">
                                    <span>{s}</span>
                                    <button onClick={() => handleRemoveSender(s)} className="text-red-400 hover:text-red-600"><Icon name="x" size={14} /></button>
                                </div>
                            ))}
                            {(!senders || senders.length === 0) && <span className="text-sm text-slate-400 italic">Belum ada pengirim tambahan.</span>}
                        </div>
                    </Card>

                    {/* MANAJEMEN USER */}
                    <Card className="max-w-4xl p-6">
                        <h3 className="font-bold text-slate-700 mb-4 flex items-center gap-2">
                            <Icon name="users" size={18} className="text-slate-500" />
                            Manajemen User & Login
                        </h3>
                        <form onSubmit={handleSaveUser} className="bg-slate-50 p-4 rounded-xl border border-slate-200 mb-6 grid grid-cols-1 md:grid-cols-5 gap-4 items-end">
                            <div className="md:col-span-1"><Input label="Nama Lengkap" value={uName} onChange={setUName} required /></div>
                            <div className="md:col-span-1"><Input label="Username" value={uUser} onChange={setUUser} required /></div>
                            <div className="md:col-span-1"><Input label="Password" value={uPass} onChange={setUPass} required /></div>
                            <div className="md:col-span-1">
                                <label className="text-sm font-semibold text-slate-600">Role</label>
                                <select value={uRole} onChange={e => setURole(e.target.value)} className="w-full px-3 py-2 border border-slate-300 rounded-lg">
                                    <option value="admin">Admin</option>
                                    <option value="hub">Tim HUB</option>
                                    <option value="hd">Tim HD</option>
                                    <option value="visitor">Visitor</option>
                                </select>
                            </div>
                            <div className="flex gap-2">
                                <Button type="submit" variant={isEditingUser ? "success" : "primary"} className="flex-1">
                                    {isEditingUser ? "Update" : "Simpan"}
                                </Button>
                                {isEditingUser && <Button onClick={resetUserForm} variant="secondary">Batal</Button>}
                            </div>
                        </form>
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm">
                                <thead className="bg-slate-100 text-slate-600 text-xs uppercase"><tr><th className="px-4 py-2">Nama</th><th className="px-4 py-2">Username</th><th className="px-4 py-2">Role</th><th className="px-4 py-2">Password</th><th className="px-4 py-2 text-right">Aksi</th></tr></thead>
                                <tbody className="divide-y divide-slate-100">
                                    {users.map(u => (
                                        <tr key={u.id}><td className="px-4 py-3 font-medium">{u.name}</td><td className="px-4 py-3">{u.username}</td><td className="px-4 py-3 capitalize"><span className="bg-slate-200 px-2 py-0.5 rounded text-xs">{u.role}</span></td><td className="px-4 py-3 font-mono text-xs text-slate-400">********</td><td className="px-4 py-3 text-right flex justify-end gap-2"><button onClick={() => editUser(u)} className="text-blue-500 hover:text-blue-700"><Icon name="edit-2" size={16} /></button><button onClick={() => handleDeleteUser(u.id)} className="text-red-400 hover:text-red-600"><Icon name="trash-2" size={16} /></button></td></tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </Card>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
